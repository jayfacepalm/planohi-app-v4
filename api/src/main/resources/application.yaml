spring:
  application:
    name: api

  # Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  # JPA / Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  security:
    cookie-secure: true

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:planohi-banners}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    presigner-endpoint: ${AWS_S3_PRESIGNER_ENDPOINT:http://localhost:4566}
    access-key: ${AWS_ACCESS_KEY_ID:mockkey}
    secret-key: ${AWS_SECRET_ACCESS_KEY:mocksecret}
    region: ${AWS_REGION:ap-northeast-1}
