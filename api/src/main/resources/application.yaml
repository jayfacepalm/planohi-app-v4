spring:
  application:
    name: api

  # Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

  # JPA / Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholder-replacement: false

  # Quartz Configuration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000

  # JavaMailSender Configuration
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

app:
  mail:
    from-address: ${SPRING_MAIL_FROM_ADDRESS:no-reply@planohi.com}
  security:
    cookie-secure: true
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

security:
  api-key: ${SECURITY_API_KEY}
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY}
    expiration-time: ${SECURITY_JWT_EXPIRATION_TIME:3600000}
    role-secret-key: ${SECURITY_JWT_ROLE_SECRET_KEY}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    endpoint: ${AWS_S3_ENDPOINT:}
    presigner-endpoint: ${AWS_S3_PRESIGNER_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{correlationId}] - %maskedMsg%n"

